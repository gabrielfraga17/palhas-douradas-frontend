# Cloud Run injeta a porta via variável de ambiente PORT, mas espera o
# container escutar em 8080 por padrão quando não configurado de outra
# forma — fixamos 8080 aqui e casamos isso no --port do gcloud run deploy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: qualquer rota que não seja um arquivo real cai no
    # index.html, deixando o roteamento (quando existir) ser resolvido no
    # lado do React, não do servidor.
    location / {
        try_files $uri /index.html;
    }

    # Cache agressivo para assets com hash no nome (gerados pelo Vite);
    # o index.html em si NÃO é cacheado, para sempre pegar o build mais
    # recente sem exigir invalidação manual de cache.
    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
